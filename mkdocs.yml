# ============================================================
# MkDocs Material 配置 —— 风格对齐官方站点
# 参考: https://squidfunk.github.io/mkdocs-material/
# ============================================================

site_name: LLM 基础设施学习笔记
site_url: https://example.com/
site_description: 大语言模型从 API 调用、微调训练到部署落地的完整学习笔记
site_author: krian

repo_url: https://github.com/krian/llm-infra-learning
repo_name: GitHub

# ------------------------------------------------------------
# 主题（核心：决定整体外观）
# ------------------------------------------------------------
theme:
  name: material
  language: zh
  features:
    # 导航
    - navigation.tabs          # 顶部标签式导航（官方站点同款）
    - navigation.tabs.sticky   # 滚动时标签栏吸顶
    - navigation.sections      # 侧边栏分组显示
    - navigation.expand        # 默认展开所有侧边栏分组
    - navigation.indexes       # 分组首页（section index）
    - navigation.top           # 返回顶部按钮
    - navigation.path          # 面包屑路径
    - navigation.tracking      # URL 随滚动同步当前章节
    # 内容
    - content.codes.copy        # 代码块一键复制
    - content.codes.select      # 代码块可全选
    - content.codes.annotate    # 代码注释
    - content.tabs.link        # 内容标签页
    - content.tooltips         # 工具提示
    - content.action.edit      # 编辑此页
    - content.action.view      # 查看源码
    # 搜索
    - search.suggest           # 搜索建议
    - search.highlight         # 搜索结果高亮
    - search.share             # 搜索结果分享
  font:
    text: Noto Sans SC         # 中文字体（需联网，离线可删）
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  # 深浅色切换（官方站点同款开关）
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: 切换至浅色模式

# ------------------------------------------------------------
# 导航结构
# ------------------------------------------------------------
# 说明：已改用 awesome-pages 插件按 docs/ 目录层级自动生成嵌套导航，
# 各级中文标题由对应目录下的 .pages 文件控制。
# 以后新增文件夹 / 笔记会自动出现在侧边栏，无需手动维护 nav。
#
# 若需恢复手动导航，取消下方注释并启用 awesome-pages 时它仍会优先生效：
# nav:
#   - 首页: index.md

# ------------------------------------------------------------
# Markdown 扩展（官方站点同款全套）
# ------------------------------------------------------------
markdown_extensions:
  - abbr
  - admonition                 # 提示框（note/tip/warning...）
  - attr_list                  # 属性列表（图片尺寸等）
  - def_list                   # 定义列表
  - footnotes                  # 脚注
  - md_in_html                 # Markdown 嵌入 HTML
  - tables
  - toc:
      permalink: true          # 标题旁的锚点链接 ¶
  - pymdownx.arithmatex:       # 数学公式
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details           # 可折叠提示框
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:        # 代码高亮
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite      # 行内代码高亮
  - pymdownx.keys              # 键盘按键样式
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:      # 代码块增强（支持 mermaid 图表）
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:           # 内容标签页
      alternate_style: true
  - pymdownx.tasklist:         # 任务列表勾选框
      custom_checkbox: true
  - pymdownx.tilde

# ------------------------------------------------------------
# 插件
# ------------------------------------------------------------
plugins:
  - search:
      lang:
        - zh
        - en
  - awesome-pages        # 按 docs/ 目录层级自动生成导航（配合各目录 .pages 文件）

# ------------------------------------------------------------
# 额外信息（页脚 / 社交链接）
# ------------------------------------------------------------
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/krian
  generator: false             # 关闭底部 "Made with MkDocs" 推广

extra_css:
  - stylesheets/extra.css      # 自定义样式（可留空文件）
